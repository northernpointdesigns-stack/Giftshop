<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- Background Subtle Grid Pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.1" />

  <!-- POS Terminal Main Base Frame -->
  <rect x="116" y="100" width="280" height="200" rx="28" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Screen Inside -->
  <rect x="136" y="120" width="240" height="136" rx="16" fill="#0B0F19" />
  
  <!-- Screen Header & Lines (Cart list simulation) -->
  <rect x="156" y="142" width="80" height="12" rx="6" fill="#34D399" />
  <rect x="310" y="142" width="46" height="12" rx="6" fill="#38BDF8" />
  
  <line x1="156" y1="172" x2="270" y2="172" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="320" y1="172" x2="356" y2="172" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />

  <line x1="156" y1="196" x2="240" y2="196" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="310" y1="196" x2="356" y2="196" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />

  <line x1="156" y1="220" x2="290" y2="220" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
  <line x1="310" y1="220" x2="356" y2="220" stroke="#34D399" stroke-width="8" stroke-linecap="round" />

  <!-- POS Stand -->
  <path d="M226 300 L216 350 L296 350 L286 300 Z" fill="#334155" />
  
  <!-- Cash Drawer Base -->
  <rect x="96" y="350" width="320" height="72" rx="18" fill="#1E293B" stroke="#334155" stroke-width="4" />
  
  <!-- Cash Drawer Slot / Receipt Output -->
  <rect x="186" y="368" width="140" height="8" rx="4" fill="#090D16" />
  
  <!-- Lock Keyhole & Status Light -->
  <circle cx="136" cy="386" r="6" fill="#34D399" />
  <rect x="360" y="380" width="24" height="12" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2" />

  <!-- Emerging Printed Receipt -->
  <path d="M206 370 L206 430 L226 420 L246 430 L266 420 L286 430 L306 420 L306 370 Z" fill="#F8FAFC" opacity="0.95" />
  <line x1="220" y1="386" x2="292" y2="386" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <line x1="220" y1="398" x2="276" y2="398" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <line x1="220" y1="410" x2="288" y2="410" stroke="#059669" stroke-width="4" stroke-linecap="round" />
</svg>
