name: Build Gift Shop POS Releases
# Build from the committed POS project root.

on:
  # Manual builds, PLUS automatic builds+release publish when a v* tag is
  # pushed (the tag's commit carries this workflow, so push-tag triggers work).
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # Unlock flag: set repo VARIABLE VITE_DISABLE_LICENSE=1 (Settings → Secrets
  # and variables → Actions → Variables) to strip the 14-day trial gate from
  # the built apps. Repos without the variable keep the customer trial flow.
  VITE_DISABLE_LICENSE: ${{ vars.VITE_DISABLE_LICENSE || '0' }}
  # Customer storefront (Giftshop repo). Override via repo Variables/Secrets:
  #   VITE_PURCHASE_URL, VITE_PAYHIP_PRODUCT_SECRET
  # The inline fallbacks match the current live products. NOTE: Payhip product
  # secret keys are designed to ship inside the public desktop app, so the
  # fallback adds no new exposure. If you rotate keys in Payhip, update the
  # repo secret VITE_PAYHIP_PRODUCT_SECRET (or these fallbacks) and rebuild.
  VITE_PURCHASE_URL: ${{ vars.VITE_PURCHASE_URL || secrets.VITE_PURCHASE_URL || 'https://payhip.com/b/PHMGz' }}
  VITE_PAYHIP_PRODUCT_SECRET: ${{ secrets.VITE_PAYHIP_PRODUCT_SECRET || vars.VITE_PAYHIP_PRODUCT_SECRET || 'prod_sk_PHMGz_35e00b7f646b2e4f54560e1b4ef02f4827c68f9d,prod_sk_hGY7k_abd0d25ad994fa4218947997e515eabcc4319742' }}

jobs:
  docs:
    name: Customer setup PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reportlab
        run: pip install reportlab

      - name: Generate customer setup guide PDF
        run: python3 scripts/build_customer_guide_pdf.py

      - name: Upload setup guide PDF
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-setup-guide
          path: island-pos-extracted/docs/Giftshop_POS_Customer_Setup_and_User_Guide.pdf
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure license mode
        shell: bash
        run: |
          echo "VITE_DISABLE_LICENSE=$VITE_DISABLE_LICENSE" >> .env.production
          if [ -n "$VITE_PURCHASE_URL" ]; then
            echo "VITE_PURCHASE_URL=$VITE_PURCHASE_URL" >> .env.production
          fi
          if [ -n "$VITE_PAYHIP_PRODUCT_SECRET" ]; then
            echo "VITE_PAYHIP_PRODUCT_SECRET=$VITE_PAYHIP_PRODUCT_SECRET" >> .env.production
          fi
          if [ "$VITE_DISABLE_LICENSE" = "1" ]; then
            echo "UNLOCKED owner build - trial/activation gate disabled"
          else
            echo "Customer build - 14-day trial gate enabled"
            echo "Purchase URL set: $([ -n \"$VITE_PURCHASE_URL\" ] && echo yes || echo no)"
            echo "Payhip secret set: $([ -n \"$VITE_PAYHIP_PRODUCT_SECRET\" ] && echo yes || echo no)"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-pos-extracted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Verify Windows signing secrets
        if: matrix.platform == 'win' && env.RELEASE_BUILD == 'true'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$WINDOWS_CERTIFICATE_BASE64" ] || [ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo '::warning::Windows signing secrets not configured — building UNSIGNED installer (SmartScreen will warn users). Set WINDOWS_CERTIFICATE_BASE64 / WINDOWS_CERTIFICATE_PASSWORD to sign.'
            exit 0
          fi

      - name: Prepare macOS signing and notarization
        if: matrix.platform == 'mac' && env.RELEASE_BUILD == 'true'
        shell: bash
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MAC_CERTIFICATE_BASE64" ] || [ -z "$MAC_CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo '::warning::macOS signing/notarization secrets not configured — building UNSIGNED app (Gatekeeper right-click > Open). Set the MAC_CERTIFICATE_* / APPLE_* secrets to sign and notarize.'
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/macos-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$MAC_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"

      - name: Build Windows installer
        if: matrix.platform == 'win' && env.RELEASE_BUILD == 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Build signed Windows installer
        if: matrix.platform == 'win' && env.RELEASE_BUILD == 'true'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win nsis --publish never

      - name: Build macOS installer (unsigned / universal DMG)
        if: matrix.platform == 'mac' && env.RELEASE_BUILD == 'false'
        run: npx electron-builder --mac dmg zip --universal --publish never -c.mac.identity=-

      - name: Build macOS installer (signed / universal DMG)
        if: matrix.platform == 'mac' && env.RELEASE_BUILD == 'true'
        env:
          CSC_LINK: data:application/x-pkcs12;base64,${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac dmg zip --universal --publish never || {
            echo '::warning::Signed macOS build failed (check MAC_CERTIFICATE_BASE64 format — must be base64 of the .p12). Retrying UNSIGNED so the release still ships.'
            CSC_LINK= CSC_KEY_PASSWORD= npx electron-builder --mac dmg zip --universal --publish never -c.mac.identity=null
          }

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-${{ matrix.platform }}
          path: |
            island-pos-extracted/dist-desktop/*.exe
            island-pos-extracted/dist-desktop/*.dmg
            island-pos-extracted/dist-desktop/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: gift-shop-pos-*

      - name: Remove non-release files
        run: |
          mkdir -p release-assets && cd release-assets
          rm -rf Info.plist PkgInfo CodeResources Assets.car App Capacitor Cordova \
            config.xml capacitor.config.json manifest.json sw.js native-bridge.js \
            PrivacyInfo.xcprivacy version.json index.html index-*.js index-*.css \
            *.nib AppIcon*.png || true
          ls -la

      - name: Purge existing release assets (clean slate, keep APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            echo "Purging assets from existing release $RELEASE_ID (APK excluded)"
            gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --paginate --jq '.[] | select(.name | endswith(".apk") | not) | .id' | while read -r ASSET_ID; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" || true
            done
          else
            echo "No existing release for ${{ github.ref_name }} — clean publish"
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.pdf
