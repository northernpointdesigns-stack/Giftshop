name: Build BoutiquePOS Installers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-desktop:
    name: Build ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: app-source

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Verify Web Bundle
        run: npm run build

      - name: Build macOS App (.dmg & .zip)
        if: matrix.os == 'macos-latest'
        run: npm run electron:build:mac

      - name: Build Windows Installer (.exe)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win

      - name: Build Linux AppImage & Snap
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoutiquePOS-${{ matrix.os }}
          path: |
            app-source/dist-desktop/*.dmg
            app-source/dist-desktop/*.zip
            app-source/dist-desktop/*.exe
            app-source/dist-desktop/*.AppImage
            app-source/dist-desktop/*.snap
            app-source/dist-desktop/snap/**/*.snap
          if-no-files-found: error

  # Creates a GitHub Release with all installers attached when you push a tag like v1.0.0
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Attach Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
