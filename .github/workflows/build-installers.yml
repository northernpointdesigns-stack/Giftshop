name: Build Standalone Desktop & Mobile Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # Job 1: Build Desktop Apps (macOS for Apple Silicon M1/M2/M3 & Intel, and Windows x64)
  build-desktop:
    name: Build Desktop Apps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React Web App
        run: npm run build

      # macOS Build (M1 onwards uses arm64, and Intel uses x64)
      - name: Compile & Package Mac App (.dmg & .zip)
        if: matrix.os == 'macos-latest'
        run: |
          npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows Build (.exe)
      - name: Compile & Package Windows App (.exe)
        if: matrix.os == 'windows-latest'
        run: |
          npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload Desktop Installers
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ocean-POS-Desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
          if-no-files-found: error

  # Job 2: Build Android App (APK & AAB via Capacitor)
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React Web App
        run: npm run build

      - name: Install Capacitor Android Platform
        run: |
          npx cap init "Ocean POS" "com.oceanpos.app" --web-dir dist || true
          npx cap add android

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Compile Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Compile Release Unsigned APK
        run: cd android && ./gradlew assembleRelease

      # Upload compiled Android APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ocean-POS-Android-Build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
