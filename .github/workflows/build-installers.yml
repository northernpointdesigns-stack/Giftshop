{
  "name": "seychelles-ocean-pos",
  "private": true,
  "version": "1.4.0",
  "type": "module",
  "main": "electron/main.cjs",
  "scripts": {
    "dev": "vite",
    "build": "tsc && vite build",
    "lint": "tsc --noEmit",
    "preview": "vite preview",
    "electron:dev": "concurrently \"vite\" \"cross-env NODE_ENV=development electron .\"",
    "electron:build": "npm run build && electron-builder",
    "electron:build:mac": "npm run build && electron-builder --mac --arm64 --x64",
    "electron:build:mac:m1": "npm run build && electron-builder --mac --arm64",
    "electron:build:win": "npm run build && electron-builder --win --x64",
    "electron:build:all": "npm run build && electron-builder -mw",
    "android:init": "cap init \"Ocean POS\" \"com.oceanpos.app\" --web-dir dist",
    "android:add": "cap add android",
    "android:build": "npm run build && cap sync android && cd android && ./gradlew assembleRelease"
  },
  "build": {
    "appId": "com.oceanpos.app",
    "productName": "Seychelles Ocean Retail POS",
    "copyright": "Copyright © 2026 Ocean Retail",
    "directories": {
      "output": "dist-desktop",
      "buildResources": "public"
    },
    "files": [
      "dist/**/*",
      "electron/**/*",
      "public/**/*",
      "package.json"
    ],
    "mac": {
      "category": "public.app-category.business",
      "icon": "public/icon.png",
      "target": [
        {
          "target": "dmg",
          "arch": ["arm64", "x64", "universal"]
        },
        {
          "target": "zip",
          "arch": ["arm64", "x64"]
        }
      ],
      "hardenedRuntime": true,
      "gatekeeperAssess": false
    },
    "win": {
      "target": [
        {
          "target": "nsis",
          "arch": ["x64", "ia32"]
        },
        {
          "target": "portable",
          "arch": ["x64"]
        }
      ],
      "icon": "public/icon.png"
    },
    "nsis": {
      "oneClick": false,
      "allowToChangeInstallationDirectory": true,
      "createDesktopShortcut": true,
      "createStartMenuShortcut": true,
      "shortcutName": "Ocean Retail POS"
    }
  },
  "dependencies": {
    "@capacitor/core": "^6.2.0",
    "canvas-confetti": "^1.9.4",
    "clsx": "^2.1.1",
    "lucide-react": "^1.16.0",
    "react": "^19.0.0",
    "react-dom": "^19.0.0",
    "tailwind-merge": "^3.0.2"
  },
  "devDependencies": {
    "@capacitor/android": "^6.2.0",
    "@capacitor/cli": "^6.2.0",
    "@tailwindcss/vite": "^4.0.9",
    "@types/canvas-confetti": "^1.9.0",
    "@types/node": "^22.13.5",
    "@types/react": "^19.0.10",
    "@types/react-dom": "^19.0.4",
    "@vitejs/plugin-react": "^4.3.4",
    "concurrently": "^9.1.2",
    "cross-env": "^7.0.3",
    "electron": "^34.0.0",
    "electron-builder": "^25.1.8",
    "tailwindcss": "^4.0.9",
    "typescript": "^5.7.3",
    "vite": "^6.2.0"
  }
}
