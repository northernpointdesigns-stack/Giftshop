name: Build Gift Shop POS Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-pos-extracted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis

      - name: Build macOS installer
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --arm64

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-${{ matrix.platform }}
          path: |
            island-pos-extracted/dist-desktop/*.exe
            island-pos-extracted/dist-desktop/*.dmg
            island-pos-extracted/dist-desktop/*.zip
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-14
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-pos-extracted/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate and sync Capacitor iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-ios-simulator
          path: island-pos-extracted/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
