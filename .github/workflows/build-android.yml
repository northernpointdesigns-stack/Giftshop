name: Build Gift Shop POS Android APK
# Build from the committed POS project root.
# This workflow intentionally runs independently from desktop releases.

on:
  # Manual builds, PLUS automatic APK builds when a v* tag is pushed.
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed to attach the APK to the GitHub release on tag builds.
permissions:
  contents: write

# Unlock flag: set repo VARIABLE VITE_DISABLE_LICENSE=1 (Settings → Secrets
# and variables → Actions → Variables) to strip the 14-day trial gate from
# the built APK. Repos without the variable keep the customer trial flow.
env:
  VITE_DISABLE_LICENSE: ${{ vars.VITE_DISABLE_LICENSE || '0' }}
  # Override via repo Variables/Secrets; inline fallbacks match the live
  # Payhip products (product secret keys are designed to ship in the app).
  VITE_PURCHASE_URL: ${{ vars.VITE_PURCHASE_URL || secrets.VITE_PURCHASE_URL || 'https://payhip.com/b/PHMGz' }}
  VITE_PAYHIP_PRODUCT_SECRET: ${{ secrets.VITE_PAYHIP_PRODUCT_SECRET || vars.VITE_PAYHIP_PRODUCT_SECRET || 'prod_sk_PHMGz_35e00b7f646b2e4f54560e1b4ef02f4827c68f9d,prod_sk_hGY7k_abd0d25ad994fa4218947997e515eabcc4319742' }}

jobs:
  build-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure license mode
        shell: bash
        working-directory: island-pos-extracted
        run: |
          echo "VITE_DISABLE_LICENSE=$VITE_DISABLE_LICENSE" >> .env.production
          if [ -n "$VITE_PURCHASE_URL" ]; then
            echo "VITE_PURCHASE_URL=$VITE_PURCHASE_URL" >> .env.production
          fi
          if [ -n "$VITE_PAYHIP_PRODUCT_SECRET" ]; then
            echo "VITE_PAYHIP_PRODUCT_SECRET=$VITE_PAYHIP_PRODUCT_SECRET" >> .env.production
          fi
          if [ "$VITE_DISABLE_LICENSE" = "1" ]; then
            echo "UNLOCKED owner build - trial/activation gate disabled"
          else
            echo "Customer build - 14-day trial gate enabled"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-pos-extracted/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-android-debug
          path: island-pos-extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage branded APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp island-pos-extracted/android/app/build/outputs/apk/debug/app-debug.apk "The.Gift.Shop.POS-1.0.0-android.apk"

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: The.Gift.Shop.POS-1.0.0-android.apk

  docs:
    name: Customer setup PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reportlab
        run: pip install reportlab

      - name: Generate customer setup guide PDF
        run: python3 scripts/build_customer_guide_pdf.py

      - name: Upload setup guide PDF
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-setup-guide
          path: island-pos-extracted/docs/Giftshop_POS_Customer_Setup_and_User_Guide.pdf
          if-no-files-found: error

