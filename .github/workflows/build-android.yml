name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'islandpos-source/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: islandpos-source
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Assemble Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoutiquePOS-android
          path: islandpos-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
