name: Build Gift Shop POS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'island-pos-extracted/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-pos-extracted/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run android:build:debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-android-debug
          path: island-pos-extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
