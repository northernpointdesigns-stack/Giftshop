name: Build Gift Shop POS Android APK
# Build from the committed POS project root.
# This workflow intentionally runs independently from desktop releases.

on:
  # Manual builds only — Actions minutes are only consumed when you click
  # "Run workflow". Pushing to main no longer triggers anything.
  workflow_dispatch:

# Unlock flag: set repo VARIABLE VITE_DISABLE_LICENSE=1 (Settings → Secrets
# and variables → Actions → Variables) to strip the 14-day trial gate from
# the built APK. Repos without the variable keep the customer trial flow.
#
# Android uses its OWN Payhip product (separate product secret + buy URL) so
# license keys issued for the Android product only unlock the Android APK.
env:
  VITE_DISABLE_LICENSE: ${{ vars.VITE_DISABLE_LICENSE || '0' }}
  VITE_PURCHASE_URL: ${{ vars.VITE_PURCHASE_URL_ANDROID || secrets.VITE_PURCHASE_URL_ANDROID || '' }}
  VITE_PAYHIP_PRODUCT_SECRET: ${{ secrets.VITE_PAYHIP_PRODUCT_SECRET_ANDROID || vars.VITE_PAYHIP_PRODUCT_SECRET_ANDROID || '' }}

jobs:
  build-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure license mode
        shell: bash
        working-directory: island-pos-extracted
        run: |
          echo "VITE_DISABLE_LICENSE=$VITE_DISABLE_LICENSE" >> .env.production
          if [ -n "$VITE_PURCHASE_URL" ]; then
            echo "VITE_PURCHASE_URL=$VITE_PURCHASE_URL" >> .env.production
          fi
          if [ -n "$VITE_PAYHIP_PRODUCT_SECRET" ]; then
            echo "VITE_PAYHIP_PRODUCT_SECRET=$VITE_PAYHIP_PRODUCT_SECRET" >> .env.production
          fi
          if [ "$VITE_DISABLE_LICENSE" = "1" ]; then
            echo "UNLOCKED owner build - trial/activation gate disabled"
          else
            echo "Customer build - 14-day trial gate enabled"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-pos-extracted/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run android:build:debug

      # ── Release signing (optional) ──────────────────────────────────
      # Add ANDROID_KEYSTORE_BASE64 (the base64 of giftshop-pos-release.keystore)
      # + ANDROID_KEYSTORE_PASSWORD as repo secrets (Settings → Secrets and
      # variables → Actions) so every manual build is signed with the SAME
      # release key → users can install updates in place without reinstall.
      # Without the secrets the build just ships the debug APK as before.
      # NOTE: the `secrets` context is NOT allowed in step `if:` conditions,
      # so keystore availability is detected via a step output instead.
      - name: Detect signing keystore
        id: signcheck
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "sign_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Decode signing keystore
        if: steps.signcheck.outputs.sign_ready == 'true'
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/giftshop-pos-release.keystore"
          test -s "$RUNNER_TEMP/giftshop-pos-release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Sign APK with release keystore
        if: steps.signcheck.outputs.sign_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$RUNNER_TEMP/app-aligned.apk"
          OUT="android/app/build/outputs/apk/debug/The.Gift.Shop.POS-1.0.0-android.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 "$SRC" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/giftshop-pos-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "Signed APK ready: $OUT"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'giftshoppos' }}

      - name: Upload Android APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-android-debug
          path: island-pos-extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android APK (release-signed)
        if: steps.signcheck.outputs.sign_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-android-signed
          path: island-pos-extracted/android/app/build/outputs/apk/debug/The.Gift.Shop.POS-1.0.0-android.apk
          if-no-files-found: error

  docs:
    name: Customer setup PDF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-pos-extracted
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reportlab
        run: pip install reportlab

      - name: Generate customer setup guide PDF
        run: python3 scripts/build_customer_guide_pdf.py

      - name: Upload setup guide PDF
        uses: actions/upload-artifact@v4
        with:
          name: gift-shop-pos-setup-guide
          path: island-pos-extracted/docs/Giftshop_POS_Customer_Setup_and_User_Guide.pdf
          if-no-files-found: error

