name: Build & Sign Giftshop POS APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build and sign APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Make SDK resolvable for Gradle
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
        working-directory: android

      - name: Check signing secrets available
        id: sign
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "sign_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.sign.outputs.sign_ready == 'true'
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/giftshop-pos-release.keystore"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK with release keystore
        if: steps.sign.outputs.sign_ready == 'true'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$RUNNER_TEMP/app-aligned.apk"
          OUT="$RUNNER_TEMP/GiftshopPOS-signed.apk"
          "$BT/zipalign" -f -p 4 "$SRC" "$ALIGNED"
          "$BT/apksigner" sign --v1-signing-enabled --v2-signing-enabled --v3-signing-enabled \
            --ks "$RUNNER_TEMP/giftshop-pos-release.keystore" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS || 'giftshoppos' }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$OUT"
          cp "$OUT" app/build/outputs/apk/debug/GiftshopPOS-signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: giftshop-pos-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed APK
        if: steps.sign.outputs.sign_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: giftshop-pos-signed
          path: android/app/build/outputs/apk/debug/GiftshopPOS-signed.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.sign_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/GiftshopPOS-signed.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}