name: Build AppImage and Snap

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- JOB 1: Build AppImage ---
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install AppImage Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse file
          # Download appimagetool
          wget -O appimagetool https://github.com
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          # Replace this section with your actual AppImage packaging command/script
          # Example assumes you have an 'AppDir' directory configured
          mkdir -p build
          ./appimagetool AppDir build/MyApp-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-appimage
          path: build/*.AppImage

  # --- JOB 2: Build Snap ---
  build-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Snap File
        uses: snapcore/action-build@v1
        id: snapcraft
        # Ensure you have a 'snap/snapcraft.yaml' file in your repository

      - name: Upload Snap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-snap
          path: ${{ steps:snapcraft.outputs.snap }}
